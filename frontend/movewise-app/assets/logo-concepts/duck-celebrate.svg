<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Confetti -->
  <rect x="18" y="20" width="7" height="3.5" fill="#F5A623" transform="rotate(30 21 22)"/>
  <rect x="90" y="18" width="7" height="3.5" fill="#27AE60" transform="rotate(-20 93 20)"/>
  <rect x="10" y="48" width="6" height="3" fill="#1F6FD0" transform="rotate(45 13 50)"/>
  <rect x="100" y="56" width="6" height="3" fill="#E74C3C" transform="rotate(-30 103 58)"/>
  <rect x="12" y="78" width="5" height="3" fill="#F5A623" transform="rotate(15 14 80)"/>
  <rect x="100" y="88" width="6" height="3" fill="#1F6FD0" transform="rotate(-40 103 90)"/>
  <circle cx="26" cy="32" r="2" fill="#F5A623"/>
  <circle cx="94" cy="36" r="2" fill="#27AE60"/>
  <circle cx="106" cy="68" r="2" fill="#F5A623"/>

  <!-- Success check badge top-right -->
  <circle cx="96" cy="24" r="14" fill="#27AE60" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M 88 24 L 94 30 L 104 18"
        stroke="#FFFFFF" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Duck body -->
  <g transform="translate(20 40)">
    <ellipse cx="40" cy="64" rx="26" ry="14" fill="#F5A623" stroke="#003A75" stroke-width="3.5"/>
    <path d="M 30 76 L 24 82 L 36 82 Z" fill="#E67E22" stroke="#003A75" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 50 76 L 44 82 L 56 82 Z" fill="#E67E22" stroke="#003A75" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="40" cy="36" r="22" fill="#F5A623" stroke="#003A75" stroke-width="3.5"/>
    <!-- Happy closed eyes (^ ^) -->
    <path d="M 29 33 Q 33 28 37 33" stroke="#003A75" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 43 33 Q 47 28 51 33" stroke="#003A75" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Smiling beak -->
    <path d="M 33 42 Q 40 40 47 42 L 47 48 Q 40 52 33 48 Z"
          fill="#E67E22" stroke="#003A75" stroke-width="2.2" stroke-linejoin="round"/>
    <ellipse cx="25" cy="42" rx="2.8" ry="1.8" fill="#E74C3C" opacity="0.55"/>
    <ellipse cx="55" cy="42" rx="2.8" ry="1.8" fill="#E74C3C" opacity="0.55"/>
  </g>
</svg>
