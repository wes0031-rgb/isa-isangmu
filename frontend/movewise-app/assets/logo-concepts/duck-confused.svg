<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Thought dots trailing -->
  <circle cx="20" cy="36" r="2" fill="#9CA3AF"/>
  <circle cx="14" cy="46" r="1.6" fill="#9CA3AF"/>
  <circle cx="12" cy="56" r="1.2" fill="#9CA3AF"/>

  <!-- Question bubble -->
  <circle cx="90" cy="24" r="15" fill="#FFFFFF" stroke="#003A75" stroke-width="3"/>
  <path d="M 80 32 L 76 38 L 82 34 Z" fill="#FFFFFF" stroke="#003A75" stroke-width="3" stroke-linejoin="round"/>
  <text x="90" y="32" text-anchor="middle" font-size="22" font-weight="900" fill="#003A75">?</text>

  <!-- Duck body (slightly tilted head) -->
  <g transform="translate(20 40)">
    <ellipse cx="40" cy="64" rx="26" ry="14" fill="#F5A623" stroke="#003A75" stroke-width="3.5"/>
    <path d="M 30 76 L 24 82 L 36 82 Z" fill="#E67E22" stroke="#003A75" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 50 76 L 44 82 L 56 82 Z" fill="#E67E22" stroke="#003A75" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Head slightly rotated -->
    <g transform="rotate(-8 40 36)">
      <circle cx="40" cy="36" r="22" fill="#F5A623" stroke="#003A75" stroke-width="3.5"/>
      <circle cx="33" cy="32" r="4.2" fill="#FFFFFF" stroke="#003A75" stroke-width="2.2"/>
      <circle cx="47" cy="32" r="4.2" fill="#FFFFFF" stroke="#003A75" stroke-width="2.2"/>
      <circle cx="34" cy="33" r="1.8" fill="#003A75"/>
      <circle cx="48" cy="33" r="1.8" fill="#003A75"/>
      <!-- Uncertain beak (straight line) -->
      <path d="M 34 44 Q 40 44 46 44 L 46 50 Q 40 52 34 50 Z"
            fill="#E67E22" stroke="#003A75" stroke-width="2.2" stroke-linejoin="round"/>
      <ellipse cx="25" cy="42" rx="2.6" ry="1.6" fill="#E74C3C" opacity="0.5"/>
      <ellipse cx="55" cy="42" rx="2.6" ry="1.6" fill="#E74C3C" opacity="0.5"/>
    </g>
  </g>
</svg>
